[package]
name = "weirdnet-openai"
version = "0.2.3"
edition = "2024"
rust-version = "1.99"
description = "Loopback-only OpenAI-compatible bridge over a weirdnet-agent inference pool: chat completions (streaming), models and embeddings, with a bearer token, a Host check and no CORS."
authors = ["Weird Brains LLC"]
license = "BSD-3-Clause"
repository = "https://github.com/WeirdBrains/weirdnet-openai"
documentation = "https://docs.rs/weirdnet-openai"
readme = "README.md"
keywords = ["llm", "openai", "inference", "bridge", "weirdnet"]
categories = ["web-programming::http-server"]
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures = "0.3"
getrandom = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "rt", "macros"] }
weirdnet-agent = "0.5.7"

[dev-dependencies]
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["net", "sync", "rt", "rt-multi-thread", "macros", "time"] }

[package.metadata.docs.rs]
all-features = true

