name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features
      # While Cargo.toml patches in an unreleased Weirdnet crate from git, the packaged crate
      # can't build against crates.io yet: check the package contents without the verify build.
      - run: if grep -q '^\[patch' Cargo.toml; then cargo package --locked --no-verify; else cargo package --locked; fi
